  # 代码质量检查
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Run Markdown Lint
        uses: avto-dev/markdown-lint@v1
        with:
          args: '**/*.md'
