name: Deploy

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, pdo, pdo_mysql, redis

      - name: Install Composer dependencies
        working-directory: ./backend
        run: |
          composer install --no-dev --optimize-autoloader --no-progress --prefer-dist

      - name: Run security check
        working-directory: ./backend
        run: |
          composer audit || true

      - name: Build assets
        run: |
          echo "Building production assets..."
          # 如果有前端构建步骤，在此添加

      - name: Create deployment artifact
        run: |
          mkdir -p artifacts
          tar -czf artifacts/release-${{ github.ref_name }}.tar.gz \
            --exclude='.git' \
            --exclude='artifacts' \
            --exclude='tests' \
            --exclude='.github' \
            backend/

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: release-${{ github.ref_name }}
          path: artifacts/release-${{ github.ref_name }}.tar.gz
          retention-days: 30

      # 部署到服务器（示例，需要配置secrets）
      # - name: Deploy to server
      #   uses: appleboy/ssh-action@master
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.DEPLOY_KEY }}
      #     script: |
      #       cd /var/www/running-app
      #       git pull origin main
      #       cd backend
      #       composer install --no-dev --optimize-autoloader
      #       php think optimize:config
      #       php think optimize:route

  deploy-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # - name: Login to Docker Hub
      #   uses: docker/login-action@v2
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          echo "Building Docker image for version ${{ steps.version.outputs.VERSION }}"
          # docker build -t running-app:${{ steps.version.outputs.VERSION }} .
          # docker tag running-app:${{ steps.version.outputs.VERSION }} running-app:latest

      # - name: Push Docker image
      #   run: |
      #     docker push running-app:${{ steps.version.outputs.VERSION }}
      #     docker push running-app:latest

  notify:
    name: Send Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-docker]
    if: always()

    steps:
      - name: Send notification
        run: |
          echo "Deployment completed for ${{ github.ref_name }}"
          echo "Status: ${{ job.status }}"
