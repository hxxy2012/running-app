apiVersion: v1
kind: Secret
metadata:
  name: running-app-secret
  namespace: running-app
type: Opaque
stringData:
  # 数据库密码
  DB_USERNAME: "root"
  DB_PASSWORD: "your_db_password_here"

  # Redis密码
  REDIS_PASSWORD: ""

  # JWT密钥
  JWT_SECRET: "your_jwt_secret_key_here_at_least_32_characters_long"

  # 短信服务密钥
  SMS_ACCESS_KEY_ID: "your_sms_access_key"
  SMS_ACCESS_KEY_SECRET: "your_sms_secret_key"

  # 对象存储密钥
  OSS_ACCESS_KEY_ID: "your_oss_access_key"
  OSS_ACCESS_KEY_SECRET: "your_oss_secret_key"
---
# 注意：在生产环境中，请使用加密的Secret
# 可以使用以下命令创建：
# kubectl create secret generic running-app-secret \
#   --from-literal=DB_PASSWORD='your_password' \
#   --from-literal=JWT_SECRET='your_jwt_secret' \
#   -n running-app
